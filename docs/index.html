<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AURA | Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <!-- Abstract Art Section -->
        <section class="art-section">

            <div class="artwork">
                <div class="shape shape-one"></div>
                <div class="shape shape-two"></div>
                <div class="shape shape-three"></div>
                <div class="shape shape-four"></div>
            </div>

            <div class="art-content">
                <span class="brand">AURA.</span>

                <div class="art-heading">
                    <h1>Where ideas<br>find their space.</h1>
                    <p>A little clarity. A lot of possibility.</p>
                </div>
            </div>

        </section>

        <!-- Login Section -->
        <section class="form-section">

            <div class="login-card">

                <div class="form-header">
                    <span class="eyebrow">WELCOME BACK</span>
                    <h2>Sign in<span class="accent">.</span></h2>
                    <p>Enter your details to continue.</p>
                </div>

                <form id="loginForm">

                    <div class="input-group">
                        <label for="username">Email address</label>

                        <input
                            type="email"
                            id="username"
                            placeholder="you@example.com"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="toggle-password"
                            >
                                Show
                            </button>
                        </div>
                    </div>

                    <div class="form-options">

                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe">
                            <span>Remember me</span>
                        </label>

                        <span class="forgot-password">
                            Forgot password?
                        </span>

                    </div>

                    <p id="errorMessage" class="error-message" role="alert"></p>

                    <button type="submit" class="login-button">
                        Sign in
                        <span>→</span>
                    </button>

                </form>

                <div class="form-footer">
                    <p>Designed with intention. © AURA 2026</p>
                </div>

            </div>

        </section>

    </main>

    <script type="module" src="app.js"></script>

</body>
</html>
